syntax = "proto3";

// this will split the generated code into multiple files
option java_multiple_files = true;
option java_package = "billing";

service BillingService {
//  rpc is the protocol that is been using under the hood
  rpc CreateBillingAccount (BillingRequest) returns (BillingResponse);
}

message BillingRequest{
  string patientId = 1;
  string name = 2;
  string email = 3;
}
message BillingResponse{
  string accountId = 1;
  string status = 2;
}